<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fason Takip Paneli</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

  <!-- Üst Başlık & İstatistik Kartları -->
  <div class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-500">
      <h3 class="text-gray-500 text-sm font-semibold">Toplama Alınan Ürün</h3>
      <p class="text-2xl font-bold text-gray-800">1,250 Adet</p>
    </div>
    <div class="bg-white p-5 rounded-lg shadow border-l-4 border-yellow-500">
      <h3 class="text-gray-500 text-sm font-semibold">Fasondaki Ürünler</h3>
      <p class="text-2xl font-bold text-gray-800">450 Adet</p>
    </div>
    <div class="bg-white p-5 rounded-lg shadow border-l-4 border-green-500">
      <h3 class="text-gray-500 text-sm font-semibold">Tamamlanan Ürünler</h3>
      <p class="text-2xl font-bold text-gray-800">800 Adet</p>
    </div>
  </div>

  <!-- İşlem Butonları ve Arama Barı -->
  <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-4 justify-between items-center">
    <div class="flex gap-2">
      <input type="text" id="searchInput" placeholder="Ürün kodu ara..." class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
      <button onclick="sendAction('ara', document.getElementById('searchInput').value)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm transition font-medium">
        Ara
      </button>
    </div>
    <div class="flex gap-2">
      <button onclick="sendAction('yeni_siparis_tiklandi', true)" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm transition font-medium">
        + Yeni Sipariş Ekle
      </button>
      <button onclick="sendAction('rapor_indir', true)" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded text-sm transition font-medium">
        Rapor İndir
      </button>
    </div>
  </div>

  <!-- Tablo Tasarımı -->
  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ürün Kodu</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Adet</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Durum</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">İşlem</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200 text-sm text-gray-700">
        <tr>
          <td class="px-6 py-4 font-semibold">FS-2026-01</td>
          <td class="px-6 py-4">250</td>
          <td class="px-6 py-4"><span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs font-medium">Fasonda</span></td>
          <td class="px-6 py-4 text-right">
            <button onclick="sendAction('detay_goster', 'FS-2026-01')" class="text-blue-600 hover:underline">Detay</button>
          </td>
        </tr>
        <tr>
          <td class="px-6 py-4 font-semibold">FS-2026-02</td>
          <td class="px-6 py-4">500</td>
          <td class="px-6 py-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-medium">Tamamlandı</span></td>
          <td class="px-6 py-4 text-right">
            <button onclick="sendAction('detay_goster', 'FS-2026-02')" class="text-blue-600 hover:underline">Detay</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Streamlit İletişim Köprüsü (Tıklamaları Çalıştıran Kısım) -->
  <script>
    function sendAction(actionType, payloadValue) {
      window.parent.postMessage({
        type: 'streamlit:setComponentValue',
        value: { action: actionType, payload: payloadValue }
      }, '*');
    }
  </script>

</body>
</html>
